<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Care Mastery Exam</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'glow': '0 0 20px rgba(59, 130, 246, 0.5)'
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth base transitions */
        body {
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Gradient Background */
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #f8fafc, #e0f2fe, #f1f5f9, #dbeafe);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        .dark .bg-gradient-animate {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #172554);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* View Switching (Fade In/Out) */
        .view-panel {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .view-panel.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Options Hover */
        .quiz-option {
            transition: all 0.2s ease;
        }
        .quiz-option:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
        .dark .quiz-option:not(:disabled):hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        /* Center Celebration Animation */
        #celebration-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .pop-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 4rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: popAnim 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        @keyframes popAnim {
            0% { transform: scale(0.3); opacity: 0; }
            20% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Click Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            font-size: 1.5rem;
            animation: floatParticle 1s ease-out forwards;
        }
        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* Rationale Slide */
        .rationale-anim {
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-animate text-slate-800 dark:text-slate-100 min-h-screen flex flex-col" id="body-el">

    <!-- Global FX Containers -->
    <div id="particle-layer"></div>
    <div id="celebration-overlay"></div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass-card border-x-0 border-t-0 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-heartbeat text-3xl text-brand-600 dark:text-brand-500"></i>
                <span class="font-bold text-xl tracking-tight">CC<span class="text-brand-600 dark:text-brand-500">Mastery</span></span>
            </div>
            
            <!-- Live Stats (Hidden on setup) -->
            <div id="live-stats" class="hidden flex items-center gap-4 text-sm font-semibold">
                <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg">
                    <i class="ph-bold ph-clock"></i> <span id="timer-display">00:00</span>
                </div>
                <div class="flex items-center gap-1.5 bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 px-3 py-1.5 rounded-lg">
                    <i class="ph-bold ph-target"></i> <span id="score-display">0</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="btn-theme" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Toggle Theme">
                    <i class="ph-fill ph-moon text-xl" id="icon-theme"></i>
                </button>
                <button id="btn-quit" class="hidden px-4 py-1.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-sm font-bold rounded-lg transition">
                    Quit
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Application Area -->
    <main class="flex-grow w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col justify-center">

        <!-- ================= VIEW 1: SETUP ================= -->
        <div id="view-setup" class="view-panel active">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">Critical Care Simulator</h1>
                <p class="text-slate-500 dark:text-slate-400 text-lg">Master the curriculum with tailored practice sessions.</p>
            </div>

            <div class="glass-card rounded-3xl p-6 md:p-10 shadow-soft">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    
                    <!-- Logic Settings -->
                    <div class="space-y-5">
                        <h3 class="text-xl font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
                            <i class="ph-fill ph-sliders text-brand-500"></i> Assessment Settings
                        </h3>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-600 dark:text-slate-300">Question Count</label>
                            <select id="config-count" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-brand-500 outline-none transition cursor-pointer">
                                <option value="5">5 Questions (Quick Test)</option>
                                <option value="20" selected>20 Questions (Standard)</option>
                                <option value="50">50 Questions (Exam)</option>
                                <option value="all">150 Questions (Comprehensive)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-600 dark:text-slate-300">Feedback Mode</label>
                            <select id="config-mode" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-brand-500 outline-none transition cursor-pointer">
                                <option value="study" selected>Study (Immediate Rationales & Feedback)</option>
                                <option value="exam">Exam (Blind until completion)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Visual Settings -->
                    <div class="space-y-5">
                        <h3 class="text-xl font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
                            <i class="ph-fill ph-palette text-brand-500"></i> Interface Preferences
                        </h3>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-600 dark:text-slate-300">Particle Effects</label>
                            <select id="config-fx" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-brand-500 outline-none transition cursor-pointer">
                                <option value="medical" selected>Medical Icons (🩺 🫀)</option>
                                <option value="stars">Stars (✨ ⭐)</option>
                                <option value="none">Disabled</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-600 dark:text-slate-300">Font Size</label>
                            <select id="config-font" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-brand-500 outline-none transition cursor-pointer">
                                <option value="text-sm">Compact</option>
                                <option value="text-base" selected>Standard</option>
                                <option value="text-lg">Large</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button id="btn-start" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold text-xl transition-all transform hover:-translate-y-1 shadow-lg flex items-center justify-center gap-2">
                    Start Simulation <i class="ph-bold ph-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- ================= VIEW 2: SINGLE QUESTION QUIZ ================= -->
        <div id="view-quiz" class="view-panel w-full">
            <div class="glass-card rounded-3xl p-6 md:p-10 shadow-soft relative overflow-hidden">
                
                <!-- Progress Line -->
                <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-200 dark:bg-slate-700">
                    <div id="quiz-progress-bar" class="h-full bg-brand-500 transition-all duration-300" style="width: 0%"></div>
                </div>

                <div class="flex justify-between items-center mb-6 mt-2">
                    <span id="quiz-category" class="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold rounded uppercase tracking-wider">Category</span>
                    <span id="quiz-counter" class="text-sm font-bold text-slate-500">Q 1/20</span>
                </div>

                <h2 id="quiz-question" class="text-2xl md:text-3xl font-bold leading-tight mb-8">Question text goes here?</h2>

                <div id="quiz-options" class="flex flex-col gap-3">
                    <!-- Buttons Injected via JS -->
                </div>

                <!-- Rationale Box -->
                <div id="quiz-rationale" class="hidden mt-6 p-5 rounded-2xl border-l-4 rationale-anim">
                    <h4 class="font-bold flex items-center gap-2 mb-1"><span id="rat-icon"></span> Rationale</h4>
                    <p id="rat-text" class="text-sm font-medium leading-relaxed"></p>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button id="btn-next" class="hidden px-8 py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold rounded-xl shadow-md hover:-translate-y-0.5 transition flex items-center gap-2">
                    Next <i class="ph-bold ph-caret-right"></i>
                </button>
                <button id="btn-finish" class="hidden px-8 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl shadow-md hover:-translate-y-0.5 transition flex items-center gap-2">
                    View Results <i class="ph-bold ph-check-circle"></i>
                </button>
            </div>
        </div>

        <!-- ================= VIEW 3: RESULTS ================= -->
        <div id="view-results" class="view-panel w-full">
            <div class="glass-card rounded-3xl p-8 md:p-12 shadow-soft text-center border-t-8 border-t-brand-500">
                <h2 id="res-heading" class="text-4xl font-extrabold mb-2">Simulation Complete</h2>
                <p id="res-subheading" class="text-slate-500 font-medium mb-8">Here is your performance breakdown.</p>
                
                <!-- Circular Chart -->
                <div class="relative w-48 h-48 mx-auto mb-8">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path class="text-slate-200 dark:text-slate-700" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="2.5" />
                        <path id="res-circle" class="text-brand-500 transition-all duration-1000 ease-out" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="res-pct" class="text-5xl font-black">0%</span>
                        <span id="res-fraction" class="text-sm font-bold text-slate-400 mt-1">0/0</span>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-3 gap-4 max-w-lg mx-auto mb-10">
                    <div class="p-4 bg-green-50 dark:bg-green-900/20 rounded-2xl border border-green-100 dark:border-green-800/30">
                        <div class="text-xs font-bold text-green-600 dark:text-green-400 uppercase">Correct</div>
                        <div class="text-2xl font-black text-green-700 dark:text-green-300" id="stat-correct">0</div>
                    </div>
                    <div class="p-4 bg-red-50 dark:bg-red-900/20 rounded-2xl border border-red-100 dark:border-red-800/30">
                        <div class="text-xs font-bold text-red-600 dark:text-red-400 uppercase">Incorrect</div>
                        <div class="text-2xl font-black text-red-700 dark:text-red-300" id="stat-incorrect">0</div>
                    </div>
                    <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <div class="text-xs font-bold text-slate-500 uppercase">Time</div>
                        <div class="text-2xl font-black text-slate-700 dark:text-slate-200" id="stat-time">0:00</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-center gap-3">
                    <button id="btn-retest" class="hidden px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl transition flex items-center justify-center gap-2">
                        <i class="ph-bold ph-arrows-clockwise"></i> Retest Incorrect (<span id="retest-count">0</span>)
                    </button>
                    <button id="btn-home" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-2">
                        <i class="ph-bold ph-house"></i> New Setup
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // =======================================================================
        // 1. DATA BANK (150 Questions covering all provided critical care PDFs)
        // =======================================================================
        const qBank = [
            // Module 1: Structure & Scope, Synergy Model (25 qs)
            { c: "Scope of Critical Care", q: "According to the AACN, critical care nursing specifically manages human responses to what?", o: ["Chronic stable illnesses requiring rehabilitation", "Actual or potential life-threatening problems", "Surgical procedures before they occur", "Primary care preventative measures"], a: 1, r: "AACN defines acute and critical care nursing as managing human responses to actual or potential life-threatening problems." },
            { c: "ICU Design", q: "What is the primary rationale for utilizing decentralized nurses' stations in the ICU?", o: ["To decrease facility building costs", "To reduce travel distance and staff response time", "To limit interactions between nursing staff", "To centralize all monitoring equipment in one room"], a: 1, r: "Decentralized stations allow staff to remain closer to patients, resulting in shorter response times and improved patient visibility." },
            { c: "ICU Design", q: "Which ICU design feature is associated with a reduction in patient mortality, delirium, and ICU length of stay?", o: ["Open-bay layouts without walls", "Continuous artificial fluorescent lighting", "Having window views and natural lighting", "Centralized supply rooms far from the patient"], a: 2, r: "Incorporating natural lighting and window views reduces sleep disruption, delirium, and ICU length of stay." },
            { c: "Synergy Model", q: "In the Synergy Model, what primarily drives the required nurse competencies?", o: ["Hospital protocols", "Patient characteristics", "Physician orders", "Available medical technology"], a: 1, r: "A core premise of the Synergy Model is that patients' characteristics drive nurses' competencies." },
            { c: "Synergy Model", q: "Which patient characteristic describes the capacity to return to a restorative level of functioning using compensatory mechanisms (bouncing back quickly)?", o: ["Stability", "Resiliency", "Vulnerability", "Complexity"], a: 1, r: "Resiliency is defined as the capacity to return to a restorative level of functioning and 'bounce back' after an insult." },
            { c: "Synergy Model", q: "A patient with intricate entanglement of two or more systems (e.g., body, family, therapies) is exhibiting which characteristic?", o: ["Vulnerability", "Complexity", "Predictability", "Resource Availability"], a: 1, r: "Complexity is defined as the intricate entanglement of two or more systems." },
            { c: "Synergy Model", q: "A nurse recognizing a patient's susceptibility to actual or potential stressors that may adversely affect outcomes is assessing which characteristic?", o: ["Stability", "Vulnerability", "Resiliency", "Participation in care"], a: 1, r: "Vulnerability is the susceptibility to stressors that may adversely affect patient outcomes." },
            { c: "Synergy Model", q: "Which nurse competency involves working on another's behalf and representing the concerns of the patient/family?", o: ["Clinical Judgment", "Systems Thinking", "Advocacy and Moral Agency", "Facilitation of Learning"], a: 2, r: "Advocacy and Moral Agency involve working on another's behalf and serving as a moral agent." },
            { c: "Synergy Model", q: "Integrating formal and informal experiential knowledge with evidence-based guidelines describes which nurse competency?", o: ["Clinical Inquiry", "Clinical Judgment", "Caring Practices", "Collaboration"], a: 1, r: "Clinical Judgment involves clinical reasoning, decision making, and integrating experiential knowledge with evidence." },
            { c: "Synergy Model", q: "Creating a compassionate, supportive, and therapeutic environment to promote comfort describes which nurse competency?", o: ["Response to Diversity", "Caring Practices", "Systems Thinking", "Facilitation of Learning"], a: 1, r: "Caring Practices aim to create a compassionate environment to promote healing and prevent unnecessary suffering." },
            { c: "Synergy Model", q: "Questioning and evaluating practice and creating practice changes through research utilization describes which competency?", o: ["Clinical Inquiry", "Systems Thinking", "Clinical Judgment", "Advocacy"], a: 0, r: "Clinical Inquiry is the ongoing process of questioning practice and creating changes through research." },
            { c: "Synergy Model", q: "Managing environmental and system resources for the patient within or across healthcare systems is known as:", o: ["Collaboration", "Systems Thinking", "Resource Availability", "Advocacy"], a: 1, r: "Systems Thinking involves using knowledge and tools to manage environmental and system resources." },
            { c: "Ethics", q: "The ethical principle that involves the right to self-determination and making decisions about one's own body is:", o: ["Autonomy", "Beneficence", "Veracity", "Fidelity"], a: 0, r: "Autonomy is the right to self-determination. Informed consent respects this principle." },
            { c: "Ethics", q: "Which ethical principle obligates nurses to avoid unnecessary physical or psychological harm?", o: ["Justice", "Fidelity", "Nonmaleficence", "Veracity"], a: 2, r: "Nonmaleficence is the duty to avoid harm and promote benefit (beneficence)." },
            { c: "Ethics", q: "The duty to be faithful to one's patients by keeping promises and fulfilling commitments is known as:", o: ["Veracity", "Justice", "Fidelity", "Autonomy"], a: 2, r: "Fidelity is the duty to keep promises and fulfill contracts and commitments." },
            { c: "Ethics", q: "Telling the truth about a diagnosis and potential risks of treatments adheres to which ethical principle?", o: ["Nonmaleficence", "Veracity", "Justice", "Beneficence"], a: 1, r: "Veracity refers to telling the truth to allow patients to make informed decisions." },
            { c: "Ethics", q: "Allocating scarce or finite ICU resources fairly falls under which ethical concept?", o: ["Fidelity", "Distributive Justice", "Autonomy", "Veracity"], a: 1, r: "Justice is often discussed in terms of distributive justice—how one allocates finite resources." },
            { c: "Family Care", q: "When a family is in crisis due to critical illness, what is an appropriate nursing intervention?", o: ["Provide false reassurance to keep them calm", "Restrict visiting hours strictly to protocol", "Help the family identify their strengths and support sources", "Avoid discussing the equipment in the room to prevent fear"], a: 2, r: "Helping the family identify strengths and support is a key intervention. Nurses should be honest, explain equipment, and advocate for flexible visiting." },
            { c: "Family Care", q: "Which statement represents an unhealthy coping mechanism for a family in crisis?", o: ["Asking detailed questions about the monitor", "Relying heavily on spiritual advisors", "Prolonged, severe denial that prevents decision making", "Seeking out the hospital's social worker"], a: 2, r: "While initial denial can be protective, ineffective/disabled coping (like prolonged denial blocking decisions) is an unhealthy mechanism." },
            { c: "Ethics", q: "What is the first step in the Case Method Approach to ethical decision making?", o: ["Evaluating the outcome", "Implementing the decision", "Defining the issues", "Assessing the problem"], a: 3, r: "Step 1 is Assessing the problem (understanding condition, goals, legal competence, preferences)." },
            { c: "ICU Environment", q: "To promote sleep and create a healing environment, a nurse should:", o: ["Bathe the patient in the middle of the night for convenience", "Leave the television on for white noise", "Cluster nursing care to evaluate the need for interruptions", "Keep room lights bright to prevent delirium"], a: 2, r: "Nurses should evaluate/cluster care interruptions, stop middle-of-the-night bathing, turn down lights/TV, and use earplugs/masks." },
            { c: "Patient Experience", q: "Anxiety in the ICU occurs when patients experience a threat of helplessness, loss of control, and:", o: ["Excessive periods of deep sleep", "Fear of dying or isolation", "A predictable routine", "High resiliency"], a: 1, r: "Anxiety triggers include threat of helplessness, loss of control, isolation, and fear of dying." },
            { c: "Patient Experience", q: "How can a nurse best help a critically ill patient exert control over their environment?", o: ["Make all decisions for them to reduce stress", "Keep their schedule unpredictable so they don't get bored", "Provide anticipatory guidance and allow choices when possible", "Limit the information given about procedures"], a: 2, r: "Allowing choices, providing order/predictability, and using anticipatory guidance helps reinforce a sense of control." },
            { c: "Ethics", q: "An Institutional Ethics Committee primarily serves to:", o: ["Make the final legal decision for the family", "Provide external consultation and facilitate education", "Discipline nurses who make ethical errors", "Manage the financial resources of the ICU"], a: 1, r: "Ethics committees provide consultation, an external voice on ethical issues, and facilitate education." },
            { c: "Family Care", q: "Which nursing diagnosis is most appropriate for a family exhibiting extreme distress and inability to make decisions regarding end-of-life care?", o: ["Decisional conflict", "Impaired comfort", "Insomnia", "Knowledge deficit"], a: 0, r: "Decisional conflict applies when a family struggles to make moral/medical choices during a crisis." },

            // Module 2: Nutrition (25 qs)
            { c: "Nutrition Patho", q: "During the 'Fight-or-Flight' (Alarm) phase of acute stress, the hypothalamus signals the adrenal glands to release:", o: ["Insulin and Glucagon", "Cortisol and Thyroid hormone", "Epinephrine and Norepinephrine", "Aldosterone and ADH"], a: 2, r: "The hypothalamus triggers the adrenal glands to release catecholamines (epinephrine & norepinephrine) in the rapid Alarm phase." },
            { c: "Nutrition Patho", q: "During the acute stress response, what happens to blood flow to the kidneys?", o: ["It increases significantly", "It remains unchanged", "It is reduced as blood is redistributed to vital organs", "It fluctuates rapidly"], a: 2, r: "Blood flow is redistributed to prioritize vital organs (heart, brain, muscles), reducing kidney perfusion." },
            { c: "Nutrition Patho", q: "Which phase of the metabolic response occurs in the first 0-24 hours and focuses on providing oxygen and glucose to vital organs?", o: ["Flow Phase", "Resistance Phase", "Ebb Phase", "Exhaustion Phase"], a: 2, r: "The 'Ebb Phase' (0-24 hours) focuses on providing oxygen/glucose to vital organs and restricts non-essential systems." },
            { c: "Nutrition Patho", q: "The 'Flow Phase' of the metabolic response is characterized by:", o: ["A hypometabolic state", "A hypermetabolic state with muscle and fat breakdown", "Restoration of normal homeostasis", "Complete energy depletion"], a: 1, r: "The Flow Phase is a hypermetabolic state that increases energy demand, leading to catabolism (breakdown) of muscle and fat." },
            { c: "Nutrition Patho", q: "In the Resistance (Prolonged Stress) Phase, the adrenal cortex releases which hormone to support gluconeogenesis?", o: ["Insulin", "Glucagon", "Cortisol", "Thyroxine"], a: 2, r: "The adrenal cortex releases cortisol, which regulates metabolism and supports gluconeogenesis." },
            { c: "Nutrition Assessment", q: "Critically ill patients require nutritional screening how often?", o: ["Daily", "Weekly", "Monthly", "Only on admission"], a: 1, r: "Critically ill patients require weekly screening due to reduced intake and catabolic effects of illness." },
            { c: "Nutrition Assessment", q: "Using the MUST tool, a patient with a BMI < 18.5 scores:", o: ["0", "1", "2", "3"], a: 2, r: "On the MUST tool, BMI >20 is 0; 18.5-20 is 1; <18.5 gives a score of 2." },
            { c: "Nutrition Assessment", q: "Why is Indirect Calorimetry (IC) often unreliable in mechanically ventilated ICU patients?", o: ["Patients are usually too cold", "High oxygen concentrations and air leaks in ventilator circuits", "The equipment is too heavy", "It only measures carbon dioxide, not oxygen"], a: 1, r: "IC is unreliable in critical care due to metabolic disturbances, high O2 concentrations, and air leakage in ventilator circuits." },
            { c: "Enteral Nutrition", q: "When should Early Enteral Nutrition (EEN) ideally be initiated in critical illness?", o: ["Immediately upon admission", "Within 24-48 hours", "After 5 days of NPO", "When bowel sounds are hyperactive"], a: 1, r: "Early enteral nutrition should be initiated within the initial 24-48 hours of critical illness presentation." },
            { c: "Enteral Nutrition", q: "What is a primary benefit of using Enteral Nutrition (EN) over Parenteral Nutrition?", o: ["It completely prevents hyperglycemia", "It preserves gut mucosal integrity and prevents bacterial translocation", "It carries zero risk of aspiration", "It does not require a functioning GI tract"], a: 1, r: "EN preserves gut mucosal integrity and prevents bacterial translocation." },
            { c: "Enteral Nutrition", q: "To reduce the risk of aspiration for a patient on enteral feeding, how should the bed be positioned?", o: ["Flat (0 degrees)", "Trendelenburg", "15 degrees upright", "30 to 45 degrees upright"], a: 3, r: "Position the patient 30 to 45 degrees upright to reduce the risk of aspiration." },
            { c: "Parenteral Nutrition", q: "Parenteral Nutrition (PN) should be considered if a patient has not met 60% of their energy target with EN after how many days?", o: ["1-2 days", "3-5 days", "7-10 days", "14-21 days"], a: 2, r: "PN is considered after 7-10 days if the patient has not met 60% of their energy target with EN." },
            { c: "Tube Care", q: "Before initiating feeding through a nasogastric tube, placement must be verified. What pH level indicates gastric placement?", o: ["pH > 7", "pH between 6 and 8", "pH < 5", "pH of exactly 7.35"], a: 2, r: "A pH < 5 on graded indicator paper confirms acidic gastric placement." },
            { c: "Glycemic Control", q: "What is the recommended target blood glucose range for critically ill patients?", o: ["70 - 100 mg/dL", "80 - 110 mg/dL", "140 - 180 mg/dL", "180 - 250 mg/dL"], a: 2, r: "The recommended target blood glucose range is 140–180 mg/dL (10 mmols/L)." },
            { c: "Glycemic Control", q: "Why is hyperglycemia common in critical illness even without a history of diabetes?", o: ["Excessive insulin production", "Cortisol triggers new glucose formation (gluconeogenesis) and insulin resistance", "The body stops utilizing glucose completely", "Intravenous fluids always contain high dextrose"], a: 1, r: "Hyperglycemia occurs due to the stress response (cortisol causing gluconeogenesis) and induced insulin resistance." },
            { c: "Refeeding Syndrome", q: "Refeeding syndrome is a life-threatening condition caused by the rapid reintroduction of nutrition, leading to a dangerous drop in which electrolytes?", o: ["Sodium, Chloride, Calcium", "Potassium, Phosphate, Magnesium", "Iron, Zinc, Copper", "Bicarbonate, Hydrogen, Potassium"], a: 1, r: "Refeeding causes a rapid cellular uptake, drastically dropping serum Potassium, Phosphate, and Magnesium." },
            { c: "Refeeding Syndrome", q: "To help prevent refeeding syndrome in a severely malnourished patient, feed should be started at what rate for the first 2 days?", o: ["No more than 50% of target", "Exactly 100% of target", "150% to catch up on calories", "10% of target"], a: 0, r: "It is recommended to start feed at no more than 50% for the first 2 days to combat the risk of refeeding syndrome." },
            { c: "Tube Care", q: "When administering medications via an NG tube, which practice is correct?", o: ["Mix all crushed medications directly into the enteral feed bag", "Crush enteric-coated tablets for easier flushing", "Flush with clean water before and after medication administration", "Use cold water to flush the tube rapidly"], a: 2, r: "Prevent blockage by flushing the tube with clean water pre- and post-medication. Drugs should NOT be added to feeds." },
            { c: "Discontinuing Support", q: "When a patient is transitioning to an oral diet, when should the feeding tube be removed?", o: ["As soon as they take their first bite of solid food", "Only after they achieve sufficient calorie and protein intake orally", "Immediately after extubation", "When they request it to be removed"], a: 1, r: "It is useful to leave feeding tubes in place when starting an oral diet until sufficient calorie and protein intake is achieved." },
            { c: "Nutrition Patho", q: "If the stress response reaches the Exhaustion Phase, what is a primary consequence?", o: ["Rapid weight gain", "Suppression of the immune system due to prolonged cortisol exposure", "Decreased risk of infection", "Immediate return to homeostasis"], a: 1, r: "The exhaustion phase leads to energy depletion, tissue breakdown, and suppression of the immune system due to prolonged cortisol." },
            { c: "Enteral Nutrition", q: "Which of the following is a sign of Enteral Nutrition intolerance?", o: ["Hyperactive bowel sounds", "Gastric residual volume of 10 mL", "Abdominal distention and diarrhea", "Weight gain of 0.1 kg/day"], a: 2, r: "Signs of EN intolerance include vomiting, regurgitation, abdominal distention, and diarrhea." },
            { c: "Nutrition Assessment", q: "When adjusting a patient's dietary prescription, a critical care dietician must account for non-nutritional energy sources, such as:", o: ["Intravenous normal saline", "Lipids provided by the sedative Propofol", "Oxygen therapy", "Heparin infusions"], a: 1, r: "Energy from non-nutritional sources, like lipids from Propofol, must be accounted for to avoid overfeeding." },
            { c: "Glycemic Control", q: "At what blood glucose level is an insulin infusion usually initiated in the ICU?", o: ["Above 100 mg/dL", "Above 140 mg/dL", "Above 180 mg/dL", "Above 250 mg/dL"], a: 2, r: "Insulin therapy is usually initiated as a continuous infusion once glucose readings are above 180 mg/dL." },
            { c: "Nutrition Patho", q: "What effect does the Ebb phase have on the body's overall metabolic rate?", o: ["Massive increase", "Restriction of non-essential systems to preserve energy", "Forces the body to build muscle", "Causes immediate starvation"], a: 1, r: "The Ebb phase restricts non-essential systems to preserve energy and focus on vital organs." },
            { c: "Enteral Nutrition", q: "If a patient on EN is experiencing delayed gastric emptying, what intervention might be considered?", o: ["Switch immediately to PN", "Use prokinetic drugs or consider jejunal access", "Place the patient flat on their back", "Increase the feed rate to push it through"], a: 1, r: "To manage intolerance/delayed emptying, elevate the bed, use prokinetic drugs, or consider jejunal access." },

            // Module 3: Pain, Sedation, Agitation, Delirium (35 qs)
            { c: "Pain Components", q: "The interpretation or meaning of pain by the person experiencing it represents which component of pain?", o: ["Sensory", "Emotional", "Cognitive", "Behavioral"], a: 2, r: "The cognitive component is the interpretation or the meaning of pain by the person experiencing it." },
            { c: "Pain Components", q: "Nociception and the stress response represent which component of pain?", o: ["Physiologic", "Behavioral", "Sensory", "Emotional"], a: 0, r: "The physiologic component includes nociception and the stress response." },
            { c: "Pain Assessment", q: "When using the PQRSTUV mnemonic, the 'Q' stands for:", o: ["Quantity", "Quality (e.g., dull, sharp, burning)", "Quickness of onset", "Quietness"], a: 1, r: "'Q' stands for Quality: As dull, aching, sharp, burning, or stabbing." },
            { c: "Pain Assessment", q: "For a mechanically ventilated patient who cannot self-report, which tool is best for assessing pain?", o: ["Numerical Rating Scale (NRS)", "Richmond Agitation-Sedation Scale (RASS)", "Critical-Care Pain Observation Tool (CPOT)", "Confusion Assessment Method (CAM-ICU)"], a: 2, r: "The CPOT is an objective behavioral observation tool used for nonverbal/intubated patients." },
            { c: "Pain Assessment", q: "On the CPOT, a patient who is 'fighting the ventilator' (blocking ventilation, alarms frequently activated) receives a score of ___ for compliance.", o: ["0", "1", "2", "3"], a: 2, r: "Fighting the ventilator (asynchrony) scores a 2 on the CPOT." },
            { c: "Pain Assessment", q: "Are vital signs (HR, BP) considered primary indicators of pain in the ICU?", o: ["Yes, they are the most reliable indicators", "Yes, they directly measure nociception", "No, they can be altered by distress, homeostasis changes, and medications", "No, because they always drop during severe pain"], a: 2, r: "Vital signs should not be considered primary indicators because they are affected by many other distress conditions and drugs. They are merely cues to assess further." },
            { c: "Pain Management", q: "What is the most life-threatening side effect of opioid administration?", o: ["Constipation", "Pruritus", "Respiratory depression", "Hypertension"], a: 2, r: "Respiratory depression (decreased RR, decreased SpO2, elevated ETCO2) is the most life-threatening opioid side effect." },
            { c: "Pain Management", q: "Which medication is an opioid antagonist used to readily reverse opioid-induced respiratory depression?", o: ["Flumazenil", "Naloxone", "Protamine sulfate", "Atropine"], a: 1, r: "Naloxone (Narcan) is the opioid antagonist used for reversal." },
            { c: "Pain Management", q: "Which of the following is a Nonopioid analgesic used in critical care?", o: ["Morphine", "Fentanyl", "Ketamine", "Hydromorphone"], a: 2, r: "Ketamine, Acetaminophen, NSAIDs, and Lidocaine are nonopioid agents. Morphine, Fentanyl, and Hydromorphone are opioids." },
            { c: "Sedation", q: "The Richmond Agitation-Sedation Scale (RASS) is used to target sedation levels. What does a RASS score of +4 indicate?", o: ["Alert and calm", "Combative, violent, immediate danger to staff", "Deep sedation, unarousable", "Restless but not aggressive"], a: 1, r: "A RASS of +4 is 'Combative' (overtly combative, violent, danger to staff)." },
            { c: "Sedation", q: "A patient briefly awakens with eye contact to a voice (for less than 10 seconds). This corresponds to a RASS score of:", o: ["0", "-1", "-2", "-4"], a: 2, r: "A RASS of -2 (Light sedation) means the patient briefly awakens to voice (<10 sec)." },
            { c: "Sedation", q: "What is the current guideline recommendation for sedation depth in critically ill patients receiving mechanical ventilation?", o: ["Deep sedation for all patients", "Moderate sedation", "Light sedation", "General anesthesia"], a: 2, r: "Current guidelines recommend targeting light sedation for critically ill patients on mechanical ventilation." },
            { c: "Sedation", q: "Which of the following is a central alpha-adrenergic receptor agonist used for sedation?", o: ["Propofol", "Midazolam", "Lorazepam", "Dexmedetomidine"], a: 3, r: "Dexmedetomidine is a central alpha-adrenergic agonist. Propofol is a sedative-hypnotic. Midazolam/Lorazepam are benzodiazepines." },
            { c: "Sedation Management", q: "To avoid sedative dependence and withdrawal, what daily practice is recommended?", o: ["Increasing the dose slightly each day", "Switching between 3 different sedatives", "Daily sedation interruption (Spontaneous Awakening Trial)", "Administering naloxone daily"], a: 2, r: "Turning off sedative infusions once each day (sedation vacation/SAT) prevents dependence and allows for neurologic assessment." },
            { c: "Agitation", q: "Before administering medications for agitation, what should the nurse do first?", o: ["Apply physical restraints", "Assess and treat underlying causes (e.g., pain, full bladder, hypoxia)", "Immediately push a high dose of Midazolam", "Perform cardioversion"], a: 1, r: "The goal is to treat the cause of the agitation (pain, hypoxia, full bladder) rather than to overmedicate." },
            { c: "Agitation", q: "Guidelines suggest using which type of agents for sedation in mechanically ventilated adults to reduce delirium risk?", o: ["Benzodiazepines (Midazolam)", "Nonbenzodiazepines (Propofol or Dexmedetomidine)", "Barbiturates", "Opioids exclusively"], a: 1, r: "Guidelines suggest using nonbenzodiazepines (propofol/dexmedetomidine) rather than benzodiazepines to reduce delirium duration." },
            { c: "Delirium", q: "Delirium is characterized by an acute disturbance in attention and awareness that:", o: ["Develops over months to years", "Fluctuates in severity during the course of a day", "Only affects long-term memory", "Is a normal, expected finding that requires no treatment"], a: 1, r: "DSM-5 criteria state delirium develops over a short period and tends to fluctuate in severity during the day." },
            { c: "Delirium", q: "A delirious patient who is quiet, withdrawn, and paranoid is exhibiting which subtype?", o: ["Hyperactive", "Hypoactive", "Mixed", "Catatonic"], a: 1, r: "The hypoactive subtype is characterized by being withdrawn, quiet, and paranoid, often misdiagnosed as depression." },
            { c: "Delirium", q: "Which tool is commonly used by nurses to assess for delirium in the ICU?", o: ["CPOT", "MUST", "CAM-ICU", "RASS"], a: 2, r: "The Confusion Assessment Method for the ICU (CAM-ICU) is the standard tool to assess for delirium." },
            { c: "Delirium", q: "Feature 2 of the CAM-ICU assesses for 'Inattention'. How is this typically tested?", o: ["Asking the patient their name and date of birth", "Having the patient squeeze a hand on the letter 'A' while reading a sequence of letters", "Checking pupillary response to light", "Asking the patient to perform a math equation"], a: 1, r: "Inattention is tested by the 'squeeze on A' letter sequence (e.g., SAVEAHAART)." },
            { c: "Delirium", q: "Which of the following is considered a 'Precipitating' (hospital-acquired) risk factor for delirium?", o: ["Advanced age", "Baseline cognitive impairment", "Mechanical ventilation and sleep disturbances", "History of alcohol abuse"], a: 2, r: "Mechanical ventilation, sleep disturbances, restraints, and certain drugs (benzos) are precipitating factors. Age and baseline cognition are predisposing." },
            { c: "Delirium", q: "Is there a specific medication that has been identified to *prevent* delirium?", o: ["Yes, Haloperidol", "Yes, Midazolam", "No medication prevents delirium", "Yes, high-dose Propofol"], a: 2, r: "No medication has been identified that prevents delirium. Management relies heavily on non-pharmacological strategies." },
            { c: "ICU Liberation", q: "In the ABCDEF bundle, what does the 'E' stand for?", o: ["Evaluate pain", "Early mobility and exercise", "Extubation protocol", "Enteral feeding"], a: 1, r: "'E' stands for Early mobility and exercise, which helps prevent muscle weakness and cognitive complications." },
            { c: "ICU Liberation", q: "In the ABCDEF bundle, what does the 'B' stand for?", o: ["Bowel management", "Both Spontaneous Awakening Trials (SATs) and Spontaneous Breathing Trials (SBTs)", "Bedside rounding", "Breathing exercises"], a: 1, r: "'B' stands for Both SATs and SBTs." },
            { c: "Agitation", q: "When a patient is dangerously combative (RASS +4) and endangering staff, which medication class is considered appropriate to administer quickly?", o: ["Aspirin", "A benzodiazepine (e.g., Midazolam)", "A paralytic agent", "Acetaminophen"], a: 1, r: "When patients are dangerously agitated or combative, a benzodiazepine may be administered for immediate safety." },
            { c: "Pain Management", q: "Which nonpharmacologic intervention falls under Cognitive-Behavioral Techniques?", o: ["Massage", "Ice Therapy", "Relaxation (breathing techniques)", "Repositioning"], a: 2, r: "Relaxation, breathing techniques, and music are cognitive-behavioral. Massage and ice are physical techniques." },
            { c: "Sedation", q: "Procedural sedation, where the patient's consciousness is depressed but they maintain their own airway, corresponds to:", o: ["Light sedation", "Moderate sedation", "Deep sedation", "General anesthesia"], a: 1, r: "Moderate sedation (procedural sedation) depresses consciousness but maintains airway, approximating RASS -3." },
            { c: "Delirium", q: "To prevent delirium, why is it recommended to avoid physical restraints?", o: ["They are too expensive", "They prevent the nurse from checking pulses", "They create unpleasant patient memories and increase agitation/delirium risk", "They interfere with the ECG monitor"], a: 2, r: "Restraints increase agitation, create unpleasant memories, and are a precipitating risk factor for delirium." },
            { c: "Delirium", q: "What is Post-Intensive Care Syndrome (PICS)?", o: ["A temporary rash acquired in the ICU", "Depression and cognitive/physical changes experienced after surviving a critical illness", "A bacterial infection of the lungs", "Failure of the kidneys post-discharge"], a: 1, r: "PICS refers to the cognitive, physical, and psychological (depression) impairments occurring after ICU discharge." },
            { c: "Pain Assessment", q: "On the CPOT, if a patient is biting the endotracheal tube and has their eyelids tightly closed, what is their Facial Expression score?", o: ["0", "1", "2", "4"], a: 2, r: "Grimacing, eyelids tightly closed, and biting the tube scores a 2 for Facial Expression." },
            { c: "Pain Assessment", q: "On the CPOT, if a patient is touching or rubbing the pain site, what is their Body Movements score?", o: ["0", "1", "2", "3"], a: 1, r: "Protection (touching/rubbing the site, slow cautious movements) scores a 1." },
            { c: "Delirium", q: "According to the CAM-ICU, if a patient has an acute change in mental status (Feature 1), >2 errors on the inattention test (Feature 2), and a RASS of -1 (Feature 3), what is the result?", o: ["CAM-ICU Negative (No Delirium)", "CAM-ICU Positive (Delirium Present)", "Inconclusive, must test Feature 4", "Comatose"], a: 1, r: "Positive for Feature 1 AND Feature 2, AND has an altered level of consciousness (RASS other than zero = Feature 3 positive) equals CAM-ICU Positive." },
            { c: "Delirium", q: "What is a characteristic of Hyperactive delirium?", o: ["Quiet and withdrawn", "Normal vital signs", "Continual movement, disoriented, shouting", "Following complex commands perfectly"], a: 2, r: "Hyperactive delirium features continual movement, disorientation, failure to follow commands, shouting, and abnormal vital signs." },
            { c: "Sedation", q: "When performing a Daily Sedation Interruption (SAT), when should the nurse restart the sedatives?", o: ["Immediately after the patient opens their eyes", "Only if the patient experiences deleterious vital sign changes or dangerous agitation", "After exactly 1 hour", "Never restart them"], a: 1, r: "Restart if the patient becomes highly agitated (endangering safety) or has severe vital sign changes, using a lower dose." },
            { c: "Ethics", q: "Interdisciplinary ethics rounds primarily provide an opportunity to:", o: ["Build trusting relationships and identify ethical problems early", "Determine which staff member made a mistake", "Discuss staff scheduling", "Force the family to make a DNR decision"], a: 0, r: "Ethics rounds build trust, develop a team approach, and identify clinical/social/ethical problems early." },

            // Module 4: ACS & Cardiac Surgery (30 qs)
            { c: "ACS", q: "Which Acute Coronary Syndrome presents with NO ST segment elevation but HAS detectable biomarkers (e.g., troponin) in the blood?", o: ["Unstable Angina", "STEMI", "NSTEMI", "Stable Angina"], a: 2, r: "NSTEMI has no ST elevation but does have biomarker release indicating necrosis." },
            { c: "ACS", q: "Which Acute Coronary Syndrome presents with ST segment elevation on the ECG and detectable biomarkers?", o: ["Unstable Angina", "STEMI", "NSTEMI", "Stable Angina"], a: 1, r: "STEMI is characterized by ST elevation and positive biomarkers." },
            { c: "ACS", q: "Which condition has NO ST changes and NO detectable biomarkers, but presents with ischemic symptoms?", o: ["Unstable Angina", "STEMI", "NSTEMI", "Pericarditis"], a: 0, r: "Unstable Angina lacks both ST elevation and biomarker release." },
            { c: "ACS Management", q: "In the first 12 hours of intermediate care for a hemodynamically stable ACS patient, what is the activity protocol?", o: ["Immediate treadmill walking", "Bed rest, progressing gradually", "Heavy lifting exercises", "Discharge to home"], a: 1, r: "Hemodynamically stable patients remain on bed rest initially, with activity level increasing gradually." },
            { c: "ACS Management", q: "Which of the following is NOT an appropriate substitute for true analgesics (like Morphine) for maximum pain relief in an ACS patient?", o: ["Fentanyl", "Hydromorphone", "Nitroglycerin", "Acetaminophen"], a: 2, r: "Nitroglycerin is a vasodilator for ischemia, not an appropriate substitute for true analgesics for maximum pain relief." },
            { c: "ACS Pharmacology", q: "Which two drug classes are initiated in the first 24 hours of ACS management to minimize cardiac workload, unless contraindicated?", o: ["Calcium Channel Blockers and Diuretics", "Beta Blockers and ACE inhibitors", "Epinephrine and Atropine", "Digoxin and Amiodarone"], a: 1, r: "Beta Blockers and ACE inhibitors are initiated in the first 24 hours to decrease myocardial workload and remodeling." },
            { c: "ACS Pharmacology", q: "For a patient with a STEMI, which medication is typically added to their daily aspirin regimen and continued for 14 days or longer?", o: ["Ibuprofen", "Clopidogrel", "Warfarin", "Apixaban"], a: 1, r: "Clopidogrel (an antiplatelet) is added to the aspirin regimen for STEMI patients." },
            { c: "Cardiac Surgery", q: "What is the primary surgical approach (incision) used for CABG and valve surgery?", o: ["Thoracotomy", "Median sternotomy", "Laparotomy", "Subcostal incision"], a: 1, r: "The median sternotomy is the most common approach for CABG." },
            { c: "CABG", q: "Which graft conduit used in CABG surgery exhibits less atherosclerosis over time and is associated with improved long-term survival?", o: ["Saphenous vein", "Internal mammary artery (IMA)", "Radial artery", "Femoral vein"], a: 1, r: "Internal mammary artery (IMA) grafts exhibit less atherosclerosis and better long-term survival (90% patent at 10 years)." },
            { c: "CABG", q: "When the saphenous vein is used as a graft, where are the two ends anastomosed?", o: ["Pulmonary artery and left ventricle", "Proximal end to the aorta, distal end to the coronary artery past the obstruction", "Proximal end to the vena cava, distal end to the right atrium", "Subclavian artery to the coronary artery"], a: 1, r: "One end is anastomosed to the aorta (proximal) and the other to the coronary artery just past the obstruction (distal)." },
            { c: "CABG", q: "About 50% of saphenous vein grafts are occluded after 10 years. Which of the following is a main process causing this failure?", o: ["Vasodilation", "Fibrointimal hyperplasia", "Excessive calcification of the aorta", "Coronary spasms"], a: 1, r: "The three main processes of saphenous graft failure are thrombosis, atherosclerosis, and fibrointimal hyperplasia." },
            { c: "Intraoperative", q: "During cardiopulmonary bypass, which medication is administered to prevent massive extravascular coagulation?", o: ["Aspirin", "Clopidogrel", "Heparin", "Warfarin"], a: 2, r: "Heparin is given to prevent coagulation in the bypass circuit." },
            { c: "Intraoperative", q: "At the end of cardiopulmonary bypass, what medication is used to reverse the effects of heparin?", o: ["Vitamin K", "Naloxone", "Protamine sulfate", "Flumazenil"], a: 2, r: "Protamine sulfate reverses heparinization." },
            { c: "Intraoperative", q: "Why is the patient's core body temperature lowered to 28° to 32°C during cardiopulmonary bypass?", o: ["To prevent fever", "To decrease cellular metabolism and oxygen demand", "To increase heart rate", "To stop bleeding instantly"], a: 1, r: "Hypothermia decreases metabolic rate and oxygen consumption while the heart is stopped." },
            { c: "Post-op Care", q: "Post-CABG, shivering must be prevented during rewarming because it:", o: ["Causes seizures", "Increases metabolic rate, oxygen consumption, and myocardial workload", "Decreases blood pressure dangerously", "Causes immediate graft failure"], a: 1, r: "Shivering increases metabolic demand, oxygen consumption, CO2 production, and myocardial workload." },
            { c: "Post-op Bleeding", q: "Post-CABG, if a patient is bleeding, why is correction of hypothermia (rewarming) critical?", o: ["Cold temperatures destroy red blood cells", "Hypothermia impairs normal coagulation enzyme function and clotting ability", "Heat causes blood vessels to constrict", "Rewarming activates heparin"], a: 1, r: "Hypothermia impairs the coagulation cascade. Normal temperature is needed for enzymes to clot blood." },
            { c: "Post-op Care", q: "What is a paradoxical risk of rapidly rewarming a post-CABG patient?", o: ["It completely stops the heart", "As temperature rises, residual heparin can be reactivated, causing increased bleeding", "It causes massive blood clots", "It leads to immediate hypovolemia"], a: 1, r: "As temperature rises, heparin can be reactivated, causing increased bleeding." },
            { c: "Post-op Bleeding", q: "What amount of chest tube drainage post-CABG is considered 'surgical bleeding' that mandates surgical re-exploration?", o: ["100 mL/h", "200 mL/h", "300 mL/h", "Exceeding 500 mL/h"], a: 3, r: "Chest tube bleeding exceeding 500 mL/h is considered surgical bleeding requiring re-exploration." },
            { c: "Post-op Care", q: "Symptoms of Systemic Inflammatory Response Syndrome (SIRS) following CABG include:", o: ["Bradycardia and hypothermia", "Fever, tachycardia, tachypnea, and increased WBC count", "Hypertension and decreased WBC count", "Apnea and pinpoint pupils"], a: 1, r: "SIRS presents with Fever, tachycardia, tachypnea, and an increase in WBC count." },
            { c: "Post-op Care", q: "Which class of analgesics should be used with extreme caution post-CABG if the patient has compromised renal function or thrombocytopenia?", o: ["Opioids (Morphine)", "Acetaminophen", "NSAIDs", "Local anesthetics"], a: 2, r: "NSAIDs can worsen renal function and impair platelet aggregation (worsening thrombocytopenia/bleeding)." },
            { c: "Post-op Fluid", q: "Decreasing urine output (oliguria) < 0.5 mL/kg/h post-CABG is most commonly caused by:", o: ["A blocked Foley catheter", "Hypovolemia leading to decreased renal perfusion", "Excessive IV fluid administration", "Direct surgical injury to the kidneys"], a: 1, r: "Oliguria is usually caused by decreased renal perfusion due to depressed cardiac function or hypovolemia." },
            { c: "Post-op Rhythm", q: "A common dysrhythmia post-CABG that decreases diastolic filling time and coronary artery perfusion is:", o: ["Sinus bradycardia", "Sinus tachycardia", "First-degree AV block", "Premature ventricular contractions"], a: 1, r: "Sinus tachycardia decreases diastolic filling time, reducing coronary perfusion." },
            { c: "Post-op Rhythm", q: "To minimize Premature Atrial Contractions (which can lead to A-Fib), it is vital to maintain adequate blood levels of:", o: ["Sodium and Chloride", "Potassium (4-4.5 mEq/L) and Magnesium", "Calcium and Phosphate", "Iron and Zinc"], a: 1, r: "Adequate potassium (4-4.5 mEq/L) and IV magnesium help minimize myocardial irritability and PACs." },
            { c: "Post-op Ventilation", q: "A post-CABG patient can typically be considered for extubation when they achieve adequate oxygenation without acidosis, bleeding is minimal, and:", o: ["Cardiac index is greater than 2.2 L/min/m2", "Heart rate is above 120 bpm", "They are deeply sedated", "Urine output is exactly 10 mL/h"], a: 0, r: "Good cardiac performance (CI > 2.2 L/min/m2) is a criterion for extubation readiness." },
            { c: "Post-op Neuro", q: "If a post-CABG patient is difficult to arouse and has pinpoint pupils, what medication might be indicated?", o: ["Propofol", "Naloxone (Narcan)", "Glycopyrrolate", "Epinephrine"], a: 1, r: "Pinpoint pupils and difficult arousal suggest narcotic overdose, reversible with Naloxone." },
            { c: "Post-op Bleeding", q: "If post-op bleeding is increasing and the PT (Prothrombin Time) is elevated >15 seconds, what treatment is indicated to replace lacking clotting factors?", o: ["Packed red blood cells", "Platelets", "Fresh Frozen Plasma (FFP)", "Normal saline"], a: 2, r: "Elevated PT indicates a lack of clotting factors (like fibrinogen), which are replaced using FFP." },
            { c: "ACS Diagnosis", q: "Which nursing diagnosis is highly applicable to a patient experiencing Acute Coronary Syndrome?", o: ["Impaired urinary elimination", "Decreased Cardiac Tissue Perfusion", "Ineffective airway clearance", "Impaired swallowing"], a: 1, r: "Decreased Cardiac Tissue Perfusion is a primary diagnosis for ACS due to blocked coronary arteries." },

            { c: "Pre-op CABG", q: "Preoperative psychological preparation for CABG should ideally include:", o: ["A detailed video of the surgical incision", "A tour of the ICU and including family in education", "Keeping the patient isolated to rest", "Refusing to answer questions to prevent anxiety"], a: 1, r: "A tour of the ICU and family inclusion are key to reducing anxiety." },

            // Module 5: Cardiac Dysrhythmias (35 qs)
            { c: "Conduction", q: "What is the normal intrinsic rate of the Sinoatrial (SA) node?", o: ["20-40 beats/min", "40-60 beats/min", "60-100 beats/min", "100-150 beats/min"], a: 2, r: "The SA node (Normal Cardiac Pacemaker) fires at 60-100 beats/min." },
            { c: "Conduction", q: "What is the intrinsic rate of the Atrioventricular (AV) node?", o: ["20-40 beats/min", "40-60 beats/min", "60-100 beats/min", "10-20 beats/min"], a: 1, r: "The AV node has an intrinsic rate of 40-60 beats/min." },
            { c: "Conduction", q: "What is the intrinsic rate of the Purkinje fibers (ventricles)?", o: ["20-40 beats/min", "40-60 beats/min", "60-100 beats/min", "80-120 beats/min"], a: 0, r: "The Purkinje fibers fire at a backup rate of 20-40 beats/min." },
