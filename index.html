            { c: "ECG Waveforms", q: "What is the normal duration of the PR interval?", o: ["Less than 0.12 seconds", "0.12 to 0.20 seconds", "0.20 to 0.28 seconds", "0.06 to 0.11 seconds"], a: 1, r: "Normal PR interval is 0.12 to 0.20 seconds (3 to 5 small squares)." },
            { c: "ECG Waveforms", q: "What does a prolonged PR interval (> 0.20 seconds) indicate?", o: ["Normal conduction", "A delay in conduction at the AV node", "Ventricular hypertrophy", "Atrial fibrillation"], a: 1, r: "The PR interval measures the time from atrial depolarization to the start of ventricular depolarization, including the delay at the AV node." },
            { c: "ECG Waveforms", q: "What does the QRS complex represent?", o: ["Atrial depolarization", "Atrial repolarization", "Ventricular depolarization", "Ventricular repolarization"], a: 2, r: "The QRS complex represents ventricular depolarization." },
            { c: "ECG Waveforms", q: "What is the normal duration of the QRS complex?", o: ["0.04 to 0.10 seconds", "0.06 to 0.11 seconds", "0.12 to 0.20 seconds", "Greater than 0.12 seconds"], a: 1, r: "Normal QRS duration is 0.06 to 0.11 seconds." },
            { c: "ECG Waveforms", q: "What does the T wave represent?", o: ["Atrial depolarization", "Ventricular depolarization", "Ventricular repolarization", "The delay at the AV node"], a: 2, r: "The T wave reflects ventricular repolarization (recovery)." },
            { c: "ECG Waveforms", q: "Why is atrial repolarization not visible on a standard ECG?", o: ["It does not generate electrical activity", "It is hidden because it occurs at the same time as the massive QRS complex", "It occurs during the T wave", "It happens before the P wave"], a: 1, r: "Atrial repolarization occurs simultaneously with ventricular depolarization (QRS), so it is masked on the ECG." },
            { c: "ECG Waveforms", q: "An elevated ST segment is a primary indicator of:", o: ["Hypokalemia", "Myocardial injury or ischemia (e.g., STEMI)", "Normal athletic heart", "Atrial fibrillation"], a: 1, r: "ST segment elevation is a classic sign of acute myocardial injury/infarction." },
            { c: "ECG Waveforms", q: "A prominent U wave (a small deflection after the T wave) is typically associated with:", o: ["Hyperkalemia", "Hypocalcemia", "Hypokalemia", "Hypernatremia"], a: 2, r: "U waves are classically associated with hypokalemia (low potassium)." },
            { c: "HR Calculation", q: "When using a 6-second ECG strip to calculate heart rate, you count the number of QRS complexes and multiply by:", o: ["6", "10", "20", "30"], a: 1, r: "There are 10 six-second intervals in a minute, so multiply the number of QRS complexes by 10." },
            { c: "HR Calculation", q: "For a completely REGULAR rhythm, you can calculate the heart rate by counting the number of LARGE squares between two R waves and dividing that number into:", o: ["100", "150", "300", "500"], a: 2, r: "Ventricular rate = 300 / number of large boxes between two R waves." },
            { c: "Sinus Rhythms", q: "Which of the following describes Normal Sinus Rhythm?", o: ["Rate 60-100, irregular rhythm, narrow QRS", "Rate 60-100, regular rhythm, P wave before every QRS, normal PR interval", "Rate > 100, regular rhythm, normal QRS", "Rate < 60, regular rhythm, normal PR interval"], a: 1, r: "Normal Sinus Rhythm: 60-100 bpm, regular, P before every QRS, PR 0.12-0.20s, QRS <0.12s." },
            { c: "Sinus Rhythms", q: "Sinus Tachycardia has all the characteristics of Normal Sinus Rhythm EXCEPT:", o: ["The rhythm is highly irregular", "The P waves are inverted", "The rate is greater than 100 beats/min", "The QRS is wider than 0.12 seconds"], a: 2, r: "Sinus Tachycardia is a sinus rhythm where the rate exceeds 100 beats/min." },
            { c: "Sinus Rhythms", q: "Which of the following is a common cause of Sinus Tachycardia?", o: ["Sleeping", "Fever, hypoxemia, or stimulants (caffeine)", "Vagal stimulation", "Beta-blocker overdose"], a: 1, r: "Stress, exercise, stimulants, fever, hypoxemia, and shock cause sinus tachycardia." },
            { c: "Sinus Rhythms", q: "A patient's ECG shows a regular rhythm with P waves before every QRS, normal intervals, and a rate of 48 beats/min. What is the rhythm?", o: ["Normal Sinus Rhythm", "Sinus Bradycardia", "First-degree AV block", "Junctional Rhythm"], a: 1, r: "Sinus Bradycardia meets all criteria for sinus rhythm but the rate is less than 60 beats/min." },
            { c: "Sinus Rhythms", q: "If a patient with Sinus Bradycardia is highly symptomatic (e.g., hypotensive, dizzy), what is the first-line medication?", o: ["Amiodarone", "Epinephrine", "Atropine", "Lidocaine"], a: 2, r: "Atropine is used to block the vagal effect and increase the heart rate in symptomatic bradycardia." },
            { c: "Sinus Rhythms", q: "Sinus Dysrhythmia is characterized by a heart rate that:", o: ["Gradually increases with inspiration and decreases with expiration", "Stops completely for 3 seconds", "Fibrillates chaotically", "Remains perfectly regular at 120 bpm"], a: 0, r: "Sinus dysrhythmia is an irregularity in sinus discharge associated with phases of the respiratory cycle." },
            { c: "Atrial Dysrhythmias", q: "Which rhythm is characterized by an abrupt onset, a regular rate of 150-250 bpm, and is caused by a reentrant circuit at the AV node?", o: ["Atrial Fibrillation", "Sinus Tachycardia", "Paroxysmal Supraventricular Tachycardia (PSVT)", "Ventricular Tachycardia"], a: 2, r: "PSVT (or AV nodal reentrant tachycardia) has a sudden onset/termination and very fast rate." },
            { c: "Atrial Dysrhythmias", q: "To terminate PSVT, what non-pharmacologic intervention can be attempted first?", o: ["Defibrillation", "Vagal stimulation (e.g., Valsalva maneuver, carotid massage)", "CPR", "Administering Atropine"], a: 1, r: "Vagal maneuvers stimulate the parasympathetic nervous system to slow conduction through the AV node." },
            { c: "Atrial Dysrhythmias", q: "Which dysrhythmia produces a classic 'sawtooth' pattern of P waves on the ECG?", o: ["Atrial Fibrillation", "Ventricular Fibrillation", "Atrial Flutter", "Sinus Dysrhythmia"], a: 2, r: "Atrial flutter features rapid atrial firing (250-350 bpm) creating a sawtooth pattern." },
            { c: "Atrial Dysrhythmias", q: "In Atrial Fibrillation, the ECG baseline appears as:", o: ["A flat isoelectric line with no waves", "Chaotic, irregular, small quivering fibrillatory waves with no distinct P waves", "Perfectly regular sawtooth waves", "Wide and bizarre QRS complexes only"], a: 1, r: "A-Fib is characterized by chaotic atrial activity with small, quivering fibrillatory waves and an irregular ventricular rhythm." },
            { c: "Atrial Dysrhythmias", q: "A major clinical concern for patients with Atrial Fibrillation (and Atrial Flutter) is the pooling of blood in the atria, which puts them at high risk for:", o: ["Ventricular rupture", "Formation of mural thrombi leading to embolic events (e.g., stroke)", "Immediate asystole", "Hypoglycemia"], a: 1, r: "The quivering atria fail to empty completely, leading to blood stasis, clot formation, and stroke risk." },
            { c: "Ventricular Dysrhythmias", q: "A Premature Ventricular Contraction (PVC) is identified on an ECG by:", o: ["A narrow QRS with a normal P wave", "A missing QRS complex", "A wide, bizarre QRS complex with a T wave opposite in direction, and no preceding P wave", "A sawtooth P wave before a normal QRS"], a: 2, r: "PVCs originate in the ventricles, bypassing the normal conduction system, resulting in a wide/bizarre QRS without a P wave." },
            { c: "Ventricular Dysrhythmias", q: "If PVCs originate from multiple different sites in the ventricle and have different shapes, they are called:", o: ["Uniform PVCs", "Multiform (or multifocal) PVCs", "Couplets", "Bigeminy"], a: 1, r: "Multiform PVCs originate from more than one ventricular site, producing different QRS shapes." },
            { c: "Ventricular Dysrhythmias", q: "A pattern where a PVC occurs after every single normal sinus beat is called:", o: ["Ventricular Trigeminy", "Ventricular Tachycardia", "Couplet", "Ventricular Bigeminy"], a: 3, r: "Bigeminy is a continuous pattern of one normal beat followed by one PVC." },
            { c: "Ventricular Dysrhythmias", q: "Ventricular Tachycardia (VT) is defined as:", o: ["One PVC occurring randomly", "Two PVCs in a row (a couplet)", "Three or more PVCs in a row", "A heart rate of 90 bpm with narrow QRS"], a: 2, r: "Three or more consecutive PVCs constitute a run of Ventricular Tachycardia." },
            { c: "Ventricular Dysrhythmias", q: "If a patient goes into sustained Ventricular Tachycardia and loses consciousness (becomes hemodynamically unstable), what is the immediate treatment?", o: ["Administer Amiodarone slowly over 1 hour", "Synchronized cardioversion or unsynchronized defibrillation", "Vagal maneuvers", "Administer Atropine"], a: 1, r: "Unstable VT requires immediate electrical therapy (cardioversion or defibrillation if pulseless)." },
            { c: "Ventricular Dysrhythmias", q: "Which dysrhythmia is characterized by rapid, irregular, chaotic oscillations with NO QRS complexes, NO pulse, and is rapidly fatal if untreated?", o: ["Ventricular Fibrillation (VF)", "Atrial Fibrillation (AF)", "Ventricular Tachycardia (VT)", "Third-degree AV block"], a: 0, r: "Ventricular Fibrillation is chaotic ventricular quivering with zero cardiac output. It requires immediate defibrillation and CPR." },
            { c: "Interventions", q: "What is the key difference in application between Cardioversion and Defibrillation?", o: ["Defibrillation is synchronized to the patient's R wave", "Cardioversion is synchronized to deliver the shock on the patient's R wave to avoid the vulnerable T wave", "Cardioversion uses higher energy levels than defibrillation", "Defibrillation is only used for conscious patients"], a: 1, r: "Cardioversion is synchronized to the R wave. Defibrillation is unsynchronized (delivered immediately) for pulseless rhythms (VF, pulseless VT)." },
            { c: "Interventions", q: "For a patient with a chronic, life-threatening tachydysrhythmia (like recurring VT), what device might be implanted for long-term management?", o: ["An external transcutaneous pacemaker", "A mechanical heart valve", "An Implantable Cardioverter-Defibrillator (ICD)", "A left ventricular assist device (LVAD)"], a: 2, r: "An ICD automatically detects life-threatening rhythms and delivers an internal shock to restore normal rhythm." }
        ];

        // =======================================================================
        // 2. STATE & CORE LOGIC
        // =======================================================================
        let workingQs = [], currentQIndex = 0, currentScore = 0, answers = [];
        let timerSeconds = 0, timerRef = null;
        
        let config = {
            count: 20, mode: 'study', fx: 'medical', font: 'text-base'
        };

        // Theme Toggle (Light/Dark)
        const html = document.documentElement;
        document.getElementById('btn-theme').addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            document.getElementById('icon-theme').className = isDark ? "ph-fill ph-sun text-xl" : "ph-fill ph-moon text-xl";
        });

        // View Switcher
        function showView(viewId) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(viewId).classList.add('active');
            }, 50); // slight delay forces reflow for CSS transition
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Shuffle Utility
        function shuffle(arr) {
            let cur = arr.length, temp, rand;
            while (cur !== 0) {
                rand = Math.floor(Math.random() * cur); cur--;
                temp = arr[cur]; arr[cur] = arr[rand]; arr[rand] = temp;
            }
            return arr;
        }

        // Format Timer
        function formatTime(s) {
            const min = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${min}:${sec}`;
        }

        // =======================================================================
        // 3. INITIALIZATION
        // ==========================================
        document.getElementById('btn-start').addEventListener('click', () => {
            
            // 1. Gather Config
            const countVal = document.getElementById('config-count').value;
            config.count = countVal === 'all' ? qBank.length : parseInt(countVal);
            config.mode = document.getElementById('config-mode').value;
            config.fx = document.getElementById('config-fx').value;
            config.font = document.getElementById('config-font').value;

            // Apply Font size to body
            document.getElementById('body-el').classList.remove('text-sm', 'text-base', 'text-lg');
            document.getElementById('body-el').classList.add(config.font);

            // 2. Prep Questions
            let pool = shuffle([...qBank]);
            workingQs = pool.slice(0, config.count).map((q, id) => {
                let mappedOpts = q.o.map((txt, idx) => ({ text: txt, isCorrect: idx === q.a }));
                return { id: id, cat: q.c, q: q.q, opts: shuffle(mappedOpts), rat: q.r };
            });

            // 3. Reset State
            currentQIndex = 0; 
            currentScore = 0; 
            answers = Array(workingQs.length).fill(null);
            
            // 4. Reset & Start Timer
            clearInterval(timerRef);
            timerSeconds = 0;
            document.getElementById('timer-display').innerText = "00:00";
            document.getElementById('score-display').innerText = "0";
            timerRef = setInterval(() => {
                timerSeconds++;
                document.getElementById('timer-display').innerText = formatTime(timerSeconds);
            }, 1000);

            // 5. Update UI
            document.getElementById('live-stats').classList.remove('hidden');
            document.getElementById('btn-quit').classList.remove('hidden');

            renderQuestion();
            showView('view-quiz');
        });

        document.getElementById('btn-quit').addEventListener('click', () => {
            if(confirm("Are you sure you want to quit the current session?")) {
                clearInterval(timerRef);
                document.getElementById('live-stats').classList.add('hidden');
                document.getElementById('btn-quit').classList.add('hidden');
                showView('view-setup');
            }
        });
        
        document.getElementById('btn-home').addEventListener('click', () => {
            document.getElementById('live-stats').classList.add('hidden');
            document.getElementById('btn-quit').classList.add('hidden');
            showView('view-setup');
        });

        // =======================================================================
        // 4. QUIZ ENGINE
        // =======================================================================
        function renderQuestion() {
            const q = workingQs[currentQIndex];
            
            // Update Headers
            document.getElementById('quiz-category').innerText = q.cat;
            document.getElementById('quiz-counter').innerText = `Q ${currentQIndex + 1}/${workingQs.length}`;
            document.getElementById('quiz-progress-bar').style.width = `${(currentQIndex / workingQs.length) * 100}%`;
            document.getElementById('quiz-question').innerText = q.q;
            document.getElementById('score-display').innerText = currentScore;
            
            // Hide Rationale and Next Buttons
            document.getElementById('quiz-rationale').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-finish').classList.add('hidden');

            // Render Options
            const optGrid = document.getElementById('quiz-options');
            optGrid.innerHTML = '';
            
            const letters = ['A','B','C','D'];
            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option w-full text-left p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-200 flex items-center gap-4';
                btn.innerHTML = `
                    <span class="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded-xl transition-colors font-black">
                        ${letters[idx]}
                    </span> 
                    <span class="leading-snug">${opt.text}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, opt, q);
                optGrid.appendChild(btn);
            });
        }

        function handleAnswer(btn, opt, q) {
            // 1. Lock all buttons
            const allBtns = document.getElementById('quiz-options').querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);
            
            // 2. Record Answer
            answers[currentQIndex] = { isCorrect: opt.isCorrect };
            if (opt.isCorrect) currentScore++;
            document.getElementById('score-display').innerText = currentScore;

            // 3. Trigger Center Animation
            triggerCelebration(opt.isCorrect);

            // 4. Visual Feedback
            if (config.mode === 'study') {
                allBtns.forEach((b, i) => {
                    const currentOpt = q.opts[i];
                    if (currentOpt.isCorrect) {
                        b.className = 'w-full text-left p-5 rounded-2xl border-2 border-green-500 bg-green-50 dark:bg-green-900/30 font-bold text-green-900 dark:text-green-300 flex items-center gap-4';
                        b.querySelector('span').className = 'flex-shrink-0 w-10 h-10 flex items-center justify-center bg-green-500 text-white rounded-xl font-black';
                    } else if (b === btn && !opt.isCorrect) {
                        b.className = 'w-full text-left p-5 rounded-2xl border-2 border-red-500 bg-red-50 dark:bg-red-900/30 font-bold text-red-900 dark:text-red-300 flex items-center gap-4';
                        b.querySelector('span').className = 'flex-shrink-0 w-10 h-10 flex items-center justify-center bg-red-500 text-white rounded-xl font-black';
                    }
                });
                
                // Show Rationale
                const rBox = document.getElementById('quiz-rationale');
                rBox.classList.remove('hidden', 'border-green-500', 'bg-green-50', 'text-green-900', 'border-red-500', 'bg-red-50', 'text-red-900', 'dark:bg-green-900/20', 'dark:bg-red-900/20');
                
                if (opt.isCorrect) {
                    rBox.classList.add('border-green-500', 'bg-green-50', 'dark:bg-green-900/20', 'text-green-900', 'dark:text-green-300');
                    document.getElementById('rat-icon').innerHTML = '<i class="ph-fill ph-check-circle text-lg"></i>';
                } else {
                    rBox.classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-900/20', 'text-red-900', 'dark:text-red-300');
                    document.getElementById('rat-icon').innerHTML = '<i class="ph-fill ph-x-circle text-lg"></i>';
                }
                document.getElementById('rat-text').innerText = q.rat;

            } else {
                // Exam Mode: Just highlight selection blue
                btn.className = 'w-full text-left p-5 rounded-2xl border-2 border-brand-500 bg-brand-50 dark:bg-brand-900/30 font-bold text-brand-900 dark:text-brand-300 flex items-center gap-4';
                btn.querySelector('span').className = 'flex-shrink-0 w-10 h-10 flex items-center justify-center bg-brand-500 text-white rounded-xl font-black';
            }

            // 5. Show Next/Finish
            if (currentQIndex < workingQs.length - 1) {
                document.getElementById('btn-next').classList.remove('hidden');
            } else {
                document.getElementById('quiz-progress-bar').style.width = '100%';
                document.getElementById('btn-finish').classList.remove('hidden');
            }
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            currentQIndex++;
            renderQuestion();
        });

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            const vQuiz = document.getElementById('view-quiz');
            if(!vQuiz.classList.contains('active')) return;
            
            const key = e.key.toLowerCase();
            const keys = { 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
            
            if(keys[key] !== undefined) {
                const btns = document.querySelectorAll('#quiz-options button');
                if(btns[keys[key]] && !btns[keys[key]].disabled) btns[keys[key]].click();
            }
            if(key === 'enter') {
                const bNext = document.getElementById('btn-next');
                const bFin = document.getElementById('btn-finish');
                if(!bNext.classList.contains('hidden')) bNext.click();
                else if(!bFin.classList.contains('hidden')) bFin.click();
            }
        });


        // =======================================================================
        // 5. RESULTS & RETEST
        // =======================================================================
        document.getElementById('btn-finish').addEventListener('click', () => {
            clearInterval(timerRef);
            
            const pct = Math.round((currentScore / workingQs.length) * 100);
            
            document.getElementById('res-pct').innerText = `${pct}%`;
            document.getElementById('res-fraction').innerText = `${currentScore} / ${workingQs.length}`;
            document.getElementById('res-circle').setAttribute('stroke-dasharray', `${pct}, 100`);
            
            document.getElementById('stat-correct').innerText = currentScore;
            const incorrect = workingQs.length - currentScore;
            document.getElementById('stat-incorrect').innerText = incorrect;
            document.getElementById('stat-time').innerText = formatTime(timerSeconds);
            
            let color = 'text-green-500';
            let title = "Exceptional!";
            let sub = "You have mastered this content perfectly.";
            
            if(pct < 80) { color = 'text-yellow-500'; title = "Good Effort"; sub = "Review your incorrect answers to close the gap."; }
            if(pct < 65) { color = 'text-orange-500'; title = "Needs Review"; sub = "Focus on the rationales to improve understanding."; }
            if(pct < 50) { color = 'text-red-500'; title = "Action Required"; sub = "Extensive review of module materials recommended."; }
            
            document.getElementById('res-circle').className.baseVal = `${color} transition-all duration-1000 ease-out`;
            document.getElementById('res-heading').className = `text-4xl md:text-5xl font-extrabold mb-3 ${color}`;
            document.getElementById('res-heading').innerText = title;
            document.getElementById('res-subheading').innerText = sub;
            
            const retestBtn = document.getElementById('btn-retest');
            if(incorrect > 0) {
                document.getElementById('retest-count').innerText = incorrect;
                retestBtn.classList.remove('hidden');
            } else {
                retestBtn.classList.add('hidden');
            }

            document.getElementById('live-stats').classList.add('hidden');
            document.getElementById('btn-quit').classList.add('hidden');
            showView('view-results');
        });

        document.getElementById('btn-retest').addEventListener('click', () => {
            // Filter only failed questions
            const failedQs = [];
            answers.forEach((ans, idx) => {
                if(!ans.isCorrect) failedQs.push(workingQs[idx]);
            });

            workingQs = failedQs;
            currentQIndex = 0;
            currentScore = 0;
            answers = Array(workingQs.length).fill(null);
            
            // Force study mode for retesting
            config.mode = 'study';
            
            // Timer Restart
            timerSeconds = 0;
            document.getElementById('timer-display').innerText = "00:00";
            document.getElementById('score-display').innerText = "0";
            timerRef = setInterval(() => {
                timerSeconds++;
                document.getElementById('timer-display').innerText = formatTime(timerSeconds);
            }, 1000);

            document.getElementById('live-stats').classList.remove('hidden');
            document.getElementById('btn-quit').classList.remove('hidden');

            renderQuestion();
            showView('view-quiz');
        });


        // =======================================================================
        // 6. ANIMATIONS & EFFECTS (JS/CSS Driven, NO External Deps)
        // =======================================================================
        const fxOverlay = document.getElementById('celebration-overlay');
        const particleLayer = document.getElementById('particle-layer');

        function triggerCelebration(isCorrect) {
            const card = document.createElement('div');
            card.className = 'pop-card glass-card';
            
            if (config.mode === 'study') {
                if (isCorrect) {
                    card.innerHTML = `<i class="ph-fill ph-check-circle text-[80px] text-green-500 mb-2 drop-shadow-md"></i><div class="text-3xl font-black text-slate-800 dark:text-white">Correct!</div>`;
                    card.style.background = 'rgba(240, 253, 244, 0.9)'; // green-50
                    if (html.classList.contains('dark')) card.style.background = 'rgba(20, 83, 45, 0.9)'; // green-900
                } else {
                    card.innerHTML = `<i class="ph-fill ph-x-circle text-[80px] text-red-500 mb-2 drop-shadow-md"></i><div class="text-3xl font-black text-slate-800 dark:text-white">Incorrect</div>`;
                    card.style.background = 'rgba(254, 242, 242, 0.9)'; // red-50
                    if (html.classList.contains('dark')) card.style.background = 'rgba(127, 29, 29, 0.9)'; // red-900
                }
            } else {
                card.innerHTML = `<i class="ph-fill ph-floppy-disk text-[80px] text-brand-500 mb-2 drop-shadow-md"></i><div class="text-3xl font-black text-slate-800 dark:text-white">Saved</div>`;
                card.style.background = 'rgba(239, 246, 255, 0.9)'; // brand-50
                if (html.classList.contains('dark')) card.style.background = 'rgba(30, 58, 138, 0.9)'; // brand-900
            }

            fxOverlay.appendChild(card);
            setTimeout(() => { if(fxOverlay.contains(card)) card.remove(); }, 1200);
        }

        const emojis = {
            medical: ['🩺','🫀','🧠','💊','🏥','💉'],
            stars: ['✨','⭐','🌟'],
            none: []
        };

        document.addEventListener('mousedown', (e) => {
            if(config.fx === 'none') return;
            const arr = emojis[config.fx];
            if(!arr || arr.length === 0) return;
            
            // Spawn 3 particles
            for(let i=0; i<3; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.innerText = arr[Math.floor(Math.random() * arr.length)];
                el.style.left = `${e.clientX - 12}px`;
                el.style.top = `${e.clientY - 12}px`;
                
                // Random drift coordinates
                el.style.setProperty('--tx', `${(Math.random() - 0.5) * 120}px`);
                el.style.setProperty('--ty', `${(Math.random() - 1) * 120}px`);
                el.style.setProperty('--rot', `${(Math.random() - 0.5) * 180}deg`);
                
                particleLayer.appendChild(el);
                setTimeout(() => { if(particleLayer.contains(el)) el.remove(); }, 1000);
            }
        });

    </script>
</body>
</html>
